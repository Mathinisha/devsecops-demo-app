name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# id-token: write is REQUIRED for GitHub's OIDC token exchange with AWS (no long-lived keys)
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devsecops-demo-app
  EKS_CLUSTER_NAME: devsecops-demo-cluster
  CODEARTIFACT_DOMAIN: devsecops-demo-domain
  CODEARTIFACT_REPO: npm-store
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  IMAGE_TAG: ${{ github.sha }}
  AWS_ACCOUNT_ID: "088585194665"          # <-- Replace with your actual 12-digit AWS account ID
  OIDC_ROLE_NAME: github-actions-oidc-role
  # Global kubectl settings
  KUBECTL_VALIDATE: "false"
  KUBECTL_COMMAND_HEADERS: "false"

jobs:
  # ---------- STAGE 1: Secret Scan ----------
  secret-scan:
    name: 1. Secret Scan (git-secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && sudo make install
      - name: Scan full history for AWS keys and secrets
        run: |
          git secrets --register-aws
          # git-secrets returns exit code 1 when no secrets found (success case)
          # exit code 2+ means actual error
          if git secrets --scan-history; then
            echo "✅ No secrets found - scan passed"
          else
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 1 ]; then
              echo "✅ No secrets found - scan passed"
              exit 0
            else
              echo "❌ Error running git-secrets scan"
              exit $EXIT_CODE
            fi
          fi

  # ---------- STAGE 2: Lint & SCA ----------
  lint-and-sca:
    name: 2. Docker Lint + SCA
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # Required for SARIF upload in Enterprise/Public repos
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint - Dockerfile best-practice lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Trivy - dependency (SCA) scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results to GitHub Security (Enterprise/Public only)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true  # Fails gracefully on private repos without Enterprise
        with:
          sarif_file: 'trivy-results.sarif'

  # ---------- STAGE 3: SAST + IaC + SBOM ----------
  sast-scan:
    name: 3. SAST, IaC scan & SBOM
    needs: lint-and-sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube static analysis
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Trivy - Infrastructure as Code scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
      - name: Generate SBOM with CycloneDX
        run: |
          npm install --package-lock-only
          npm install -g @cyclonedx/cyclonedx-npm
          cyclonedx-npm --output-file sbom.json || echo "SBOM generation completed with warnings"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

  # ---------- STAGE 4: Build, Sign & Push to ECR ----------
  build-and-push:
    name: 4. Build, Sign & Push Image
    needs: sast-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC Token Claims
        run: |
          JWT=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== Decoded JWT Payload ==="
          echo "$JWT" | cut -d'.' -f2 | base64 -d 2>/dev/null | jq . || echo "Failed to decode JWT"

      - name: Configure AWS credentials (OIDC - keyless)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Authenticate npm to AWS CodeArtifact
        run: |
          aws codeartifact login --tool npm \
            --repository ${{ env.CODEARTIFACT_REPO }} \
            --domain ${{ env.CODEARTIFACT_DOMAIN }} \
            --domain-owner ${{ env.AWS_ACCOUNT_ID }}

      - name: Build Docker image
        id: build-image
        run: |
          IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          docker build -t "$IMAGE_URI" .
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Trivy - scan image before push
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.build-image.outputs.image }}
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Push image to Amazon ECR
        run: docker push ${{ steps.build-image.outputs.image }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign (keyless / Sigstore)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes ${{ steps.build-image.outputs.image }}

      # Note: Amazon Inspector does NOT need a pipeline step -
      # it continuously scans any image sitting in ECR automatically
      # once enabled at the account level (see README Step 8).

  # ---------- STAGE 5: Manual Approval + Deploy to EKS ----------
  deploy:
    name: 5. Deploy to EKS
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: production   # Configure required reviewers + 48h wait timer on this Environment in GitHub settings
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure EKS cluster access  
        run: |
          # Configure kubectl context
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
          
          # Verify connection and cluster permissions
          kubectl auth can-i get pods

      - name: Deploy application
        run: |
          # Replace image placeholder with actual ECR image
          sed -i "s|IMAGE_PLACEHOLDER|${{ needs.build-and-push.outputs.image }}|g" k8s/deployment.yaml
          
          # Apply deployments
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          
          # Wait for deployment to be ready
          kubectl rollout status deployment/devsecops-demo-app --timeout=300s
          
          # Verify deployment
          kubectl get pods -l app=devsecops-demo-app
          kubectl get svc devsecops-demo-app

  # ---------- STAGE 6: DAST Scan ----------
  dast-scan:
    name: 6. DAST Scan (OWASP ZAP)
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Get LoadBalancer URL
        id: get-url
        run: |
          echo "Waiting for LoadBalancer to get external IP..."
          for i in {1..60}; do
            HOSTNAME=$(kubectl get svc devsecops-demo-app -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            if [ -n "$HOSTNAME" ] && [ "$HOSTNAME" != "null" ]; then 
              echo "LoadBalancer ready: $HOSTNAME"
              echo "url=http://$HOSTNAME" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Attempt $i/60: Waiting for LoadBalancer hostname..."
            sleep 10
          done
          
          # Fallback to NodePort if LoadBalancer fails
          if [ -z "$HOSTNAME" ] || [ "$HOSTNAME" == "null" ]; then
            echo "LoadBalancer not ready, using NodePort access..."
            NODE_IP=$(kubectl get nodes -o jsonpath='{.items[0].status.addresses[?(@.type=="ExternalIP")].address}')
            NODE_PORT=$(kubectl get svc devsecops-demo-app -o jsonpath='{.spec.ports[0].nodePort}')
            echo "url=http://$NODE_IP:$NODE_PORT" >> "$GITHUB_OUTPUT"
          fi

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ steps.get-url.outputs.url }}
          
      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: report_html.html

  # ---------- STAGE 7: Runtime Security Verification ----------
  runtime-security-check:
    name: 7. Runtime Security Verification
    needs: dast-scan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/${{ env.OIDC_ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Verify Falco is running as a daemonset
        run: |
          # Verify Falco daemonset status on the cluster
          kubectl get daemonset -n falco || echo "Falco daemonset not found"
          kubectl get pods -n falco -l app=falco || echo "Falco pods not found or still starting..."

      # GuardDuty verification - commented out for POC (enable in production)
      # - name: Verify GuardDuty EKS protection status
      #   run: aws guardduty list-detectors --region ${{ env.AWS_REGION }}

  # ---------- Fail-fast notification ----------
  notify-on-failure:
    name: Notify on Pipeline Failure
    needs: [secret-scan, lint-and-sca, sast-scan, build-and-push, deploy, dast-scan, runtime-security-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}   # Add this secret in repository settings
          password: ${{ secrets.MAIL_PASSWORD }}   # Add this secret in repository settings  
          subject: "DevSecOps Pipeline Failed: ${{ github.repository }}"
          to: ${{ secrets.NOTIFY_EMAIL }}          # Add this secret in repository settings
          from: DevSecOps Pipeline <noreply@github.com>
          body: |
            🚨 DevSecOps Pipeline Failure Alert
            
            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            
            🔗 View Failed Run: 
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            
            Please investigate and fix the security/quality issues.
